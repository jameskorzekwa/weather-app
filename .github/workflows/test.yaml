name: Tests

# Lint, type-check, unit-test and production-build the Next.js app. Runs on
# every PR to main and on every push to main. This is independent of the
# add-on Docker build (build.yaml) so a UI regression doesn't get masked by
# a successful image push, and vice versa.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'homeassistant/**'
      - '.github/workflows/build.yaml'
      - '.dockerignore'
      - 'repository.yaml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint + test + build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # .nvmrc pins the Node major (24.x) — keep them in lockstep.
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint is intentionally skipped: `next lint` was removed in Next.js 15
      # and `package.json` still has `"lint": "next lint"` from before the
      # Next 16 upgrade. There's no ESLint flat config in the repo either,
      # so a straight `eslint .` would also fail. Add lint back here once
      # the project's lint setup is repaired.

      - name: Unit tests
        # vitest in `npm test` (see package.json) runs the 74 tests under test/.
        run: npm test

      - name: Production build
        # Catches type errors that the test runner (with css:false) and lint
        # don't surface — e.g. App Router metadata typing changes.
        run: npm run build
