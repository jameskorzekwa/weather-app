name: CI and release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/AGENTS.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/AGENTS.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: App lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release versions
        run: node .github/scripts/bump-version.mjs --check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  addon:
    name: Home Assistant add-on lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate add-on configuration
        uses: frenck/action-addon-linter@v2.21.0
        with:
          path: './homeassistant'

  integration:
    name: Home Assistant integration validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

      - name: HACS
        uses: hacs/action@main
        with:
          category: integration
          comment: false
          # HACS reads the license from the default branch, where this PR's
          # first LICENSE file cannot exist yet. Main runs do not ignore it.
          ignore: ${{ github.event_name == 'pull_request' && 'license' || '' }}

  docker:
    name: Docker build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./homeassistant/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=check-${{ matrix.arch }}
          cache-to: type=gha,scope=check-${{ matrix.arch }},mode=max
          build-args: |
            BUILD_FROM=node:24-alpine
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=check
            BUILD_DATE=${{ github.event.repository.updated_at }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=https://github.com/${{ github.repository }}
            BUILD_NAME=Weather App
            BUILD_DESCRIPTION=Animated weather UI for Home Assistant

  prepare-release:
    name: Bump release version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [app, addon, integration, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Bump and commit release version
        id: release
        run: |
          tested_sha="${GITHUB_SHA}"

          ensure_only_agents_changes() {
            if ! git merge-base --is-ancestor "${tested_sha}" origin/main; then
              echo "::error::main no longer contains tested commit ${tested_sha}"
              return 1
            fi

            while IFS= read -r path; do
              case "${path}" in
                AGENTS.md|*/AGENTS.md) ;;
                *)
                  echo "::error file=${path}::Untested change reached main during release"
                  return 1
                  ;;
              esac
            done < <(git diff --name-only "${tested_sha}" origin/main)
          }

          git fetch origin main:refs/remotes/origin/main --tags
          if [ "$(git rev-parse origin/main)" != "${tested_sha}" ]; then
            ensure_only_agents_changes
            git switch --detach origin/main
          fi

          version=$(node .github/scripts/bump-version.mjs)
          tag="v${version}"

          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            echo "::error::Release tag ${tag} already exists"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION homeassistant/config.yaml custom_components/weather_app/manifest.json
          git commit -m "chore(release): ${tag}"

          if ! git push origin HEAD:main; then
            git fetch origin main:refs/remotes/origin/main
            ensure_only_agents_changes
            git rebase origin/main
            git push origin HEAD:main
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-images:
    name: Publish image (${{ matrix.arch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/weather-app-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./homeassistant/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.prepare-release.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=check-${{ matrix.arch }}
          cache-to: type=gha,scope=check-${{ matrix.arch }},mode=max
          build-args: |
            BUILD_FROM=node:24-alpine
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ needs.prepare-release.outputs.version }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            BUILD_REF=${{ needs.prepare-release.outputs.sha }}
            BUILD_REPOSITORY=https://github.com/${{ github.repository }}
            BUILD_NAME=Weather App
            BUILD_DESCRIPTION=Animated weather UI for Home Assistant

  publish-release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare-release, publish-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: gh release create "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --target "${RELEASE_SHA}" --title "v${VERSION}" --generate-notes
