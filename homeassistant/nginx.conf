# nginx config for the Home Assistant add-on.
#
# Two jobs:
#   1. Reverse-proxy port 8099 (the HA ingress_port) to `next start` on :3000.
#   2. Rewrite absolute asset paths (`/_next/...`, `/api/...`) in HTML and JS
#      responses so they include HA's per-session ingress prefix, which is
#      sent on every request as the `X-Ingress-Path` header.
#
# Why the rewriting is needed: under HA ingress the browser sees the addon at
#     https://homeassistant.local/api/hassio_ingress/<TOKEN>/
# but Next.js emits `<script src="/_next/static/...">` (no prefix). Without
# rewriting, the browser would request /_next/... which HA does not route to
# the addon, and the page would fail to load any chunks.
#
# The `$http_x_ingress_path` variable resolves to an empty string when the
# header is absent (i.e. direct port access), so the sub_filter replacements
# become no-ops — direct-port and ingress access both work from the same
# config.

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Per-user monochrome override. HA's supervisor forwards the requesting
    # user on every ingress request as BOTH a display name
    # (`X-Remote-User-Display-Name`, e.g. "Weather Station B&W") and a
    # username (`X-Remote-User-Name`, e.g. "weather-bw"). We match the
    # configured `monochrome_users` list against both, so an admin can list
    # either the username or the display name and it just works — handy
    # because the addon options field is free text (HA add-on schemas have
    # no user picker) and people naturally type the username.
    #
    # run.sh injects the same `"<name>" "1";` entries into both maps below
    # (its awk replaces every per-user-entries marker line) and fills the
    # combine map's default with the addon-wide `monochrome` value ("1" or
    # empty). NB: don't write the literal marker tokens in these comments —
    # run.sh would substitute them here too and break the config.
    map $http_x_remote_user_display_name $mono_by_display_name {
        default "";
@@USER_MONO_MAP_ENTRIES@@
    }
    map $http_x_remote_user_name $mono_by_username {
        default "";
@@USER_MONO_MAP_ENTRIES@@
    }
    # If EITHER the display-name or the username map produced "1", the
    # joined string contains a "1" → force mono. Otherwise fall back to the
    # addon-wide default. (Each half is only "" or "1", so a substring match
    # on "1" is unambiguous.)
    map "$mono_by_display_name$mono_by_username" $user_mono {
        default "@@DEFAULT_MONO@@";
        "~1"    "1";
    }

    # The placeholder on the second line of the map below is replaced by
    # run.sh at startup with the query string built from /data/options.json
    # (e.g. `?lat=...&apikey=...&mono=$user_mono`). When the user hasn't
    # configured anything, run.sh substitutes an empty string and
    # $default_redirect stays empty.
    #
    # Note that the substituted value can itself contain nginx variables
    # like `$user_mono` — they are resolved per-request when the map result
    # is consumed by `return 302 $default_redirect`.
    map $args $default_redirect {
        default "";
        ""      "@@DEFAULT_REDIRECT@@";
    }

    # --- Startup identity gate ------------------------------------------
    # HA attaches the requesting user to every ingress request via the
    # X-Remote-User-* headers — that's what the mono maps above key on. But
    # while HA Core is still starting up it proxies ingress traffic BEFORE
    # user identity is wired up: requests arrive with X-Ingress-Path but no
    # X-Remote-User-*. If we answered the root redirect in that window we'd
    # bake `mono=` (empty) into the URL, and a monochrome user's dashboard
    # would come back in color after every HA restart — and stay that way,
    # because a rendered-but-wrong-palette page looks healthy to everything.
    # So when a request came through ingress but carries no identity yet,
    # don't commit to a mono value: serve a tiny self-refreshing wait page
    # (see the internal location below) until identity shows up — normally
    # a few seconds after Core finishes starting.
    # Direct :8099 access never has X-Ingress-Path, so it is unaffected.
    map "$http_x_remote_user_name$http_x_remote_user_display_name" $ingress_user_missing {
        default "";
        ""      "1";
    }
    # Ingress (path header non-empty, always starts with "/") AND no user.
    # ":" as separator — it can't appear in the ingress path, so a token
    # that happens to end in "1" can't fake a match.
    map "$http_x_ingress_path:$ingress_user_missing" $identity_pending {
        default "";
        "~^/.+:1$" "1";
    }
    # Only gate requests that would otherwise take the `location = /` 302 —
    # i.e. a bare root request with defaults configured. Health checks and
    # already-parameterised URLs must keep flowing during startup.
    map "$default_redirect:$identity_pending" $serve_identity_wait {
        default "";
        "~^.+:1$" "1";
    }

    server {
        listen 8099 default_server;
        server_name _;

        # Generous limits — weather payloads are small but allow headroom.
        client_max_body_size 1m;

        # If the user lands on the addon root without any query params, send
        # them to the same URL with the defaults filled in. Using a relative
        # `Location:` value preserves HA's ingress prefix automatically.
        location = / {
            # Ingress request with no user identity yet (HA still starting):
            # we can't decide mono, so hold on the wait page instead of
            # committing a wrong redirect. The page re-requests `/` every
            # couple of seconds; once Core attaches identity this branch
            # stops matching and the normal redirect below takes over.
            if ($serve_identity_wait) {
                rewrite ^ /__wa_identity_wait last;
            }
            if ($default_redirect != "") {
                return 302 $default_redirect;
            }
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path $http_x_ingress_path;
            # Force identity encoding so sub_filter can rewrite the body.
            proxy_set_header Accept-Encoding "";

            sub_filter_once off;
            sub_filter_types text/html application/javascript;
            sub_filter '"/_next/'   '"$http_x_ingress_path/_next/';
            sub_filter '"/api/'     '"$http_x_ingress_path/api/';
            sub_filter '"/favicon'  '"$http_x_ingress_path/favicon';
        }

        # The identity wait page. Reached only via the internal rewrite in
        # `location = /` above; `internal` makes direct requests 404.
        #
        # Identity can be missing for two reasons:
        #   1. HA Core is still starting (resolves by itself in seconds) —
        #      the meta refresh re-requests `/` until the redirect takes over.
        #   2. The client's ingress session was created BEFORE the last Core
        #      restart: Core keeps such sessions valid but permanently loses
        #      their user attribution, so identity will NEVER arrive on this
        #      session. Only the card can fix that (by creating a new session)
        #      — the X-WA-Identity-Wait header below is its signal to do so
        #      (see _reconcileMono in weather-app-card.js). For clients running
        #      older card JS that can't react, the inline script fails open to
        #      the default redirect after ~60s, i.e. the palette may be wrong
        #      (pre-gate behavior) but the dashboard is never wedged here.
        #
        # The wording deliberately avoids anything _looksBroken() in the card
        # would classify as a server error page.
        location = /__wa_identity_wait {
            internal;
            default_type text/html;
            add_header Cache-Control "no-store";
            add_header X-WA-Identity-Wait "1" always;
            return 200 '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="2"><title>Weather App</title><style>html,body{height:100%;margin:0;display:flex;align-items:center;justify-content:center;background:#111;color:#8a94a6;font:14px sans-serif}</style></head><body>Waiting for Home Assistant to finish starting<script>try{var k="wa_wait_start",now=Date.now(),s=+sessionStorage.getItem(k)||0;if(!s||now-s>300000){sessionStorage.setItem(k,String(now))}else if(now-s>60000){sessionStorage.removeItem(k);location.replace("$default_redirect")}}catch(e){}</script></body></html>';
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path $http_x_ingress_path;
            proxy_set_header Accept-Encoding "";

            # Rewrite asset/API references in any HTML or JS chunks that ship
            # absolute paths. Other content-types (images, fonts, JSON from
            # OpenMeteo) pass through unchanged.
            sub_filter_once off;
            sub_filter_types text/html application/javascript;
            sub_filter '"/_next/'   '"$http_x_ingress_path/_next/';
            sub_filter '"/api/'     '"$http_x_ingress_path/api/';
            sub_filter '"/favicon'  '"$http_x_ingress_path/favicon';
        }
    }
}
