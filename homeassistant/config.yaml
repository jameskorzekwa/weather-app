---
# Home Assistant add-on manifest.
# Docs: https://developers.home-assistant.io/docs/add-ons/configuration/

name: Weather App
version: "0.6.0"
slug: weather_app
description: >-
  Animated weather backgrounds with current conditions and a 5-day forecast,
  rendered as a Home Assistant sidebar panel. Same UI as the Vercel build.
url: "https://github.com/jameskorzekwa/weather-app"

# Architectures the pre-built image is published for. We only publish for
# the platforms `node:24-alpine` supports on Docker Hub — currently amd64
# and aarch64. armhf, armv7, and i386 don't have node:24-alpine variants
# published. This covers all modern HA hosts (x86 NUCs, RPi 4/5, M-series
# Macs running HA in a VM, etc.). To add another arch, you'd also have to
# pick a different base image for that arch.
arch:
  - aarch64
  - amd64

# Pre-built image published by .github/workflows/build.yaml to GHCR.
# `{arch}` is replaced by HA Supervisor at pull time. Keep the GitHub
# user/org in sync with build.yaml and the workflow.
image: "ghcr.io/jameskorzekwa/weather-app-{arch}"

# We are not using s6-overlay — run.sh manages nginx + next together.
init: false

# Ingress puts the addon behind HA's auth proxy and lets us add a sidebar
# panel without the user touching configuration.yaml.
ingress: true
ingress_port: 8099
panel_icon: mdi:weather-partly-cloudy
panel_title: Weather
# Visible to all HA users, not just admins (defaults to true = admin-only).
panel_admin: false

# Direct web access on a host port, in addition to ingress. This lets you
# point a plain Lovelace "Webpage" card (or any browser on the LAN) at
# http://<your-ha-host>:8099/ with a stable URL — handy for using the
# dashboard as a default/landing page or a wall display.
#
# Trade-offs vs. the ingress sidebar panel:
#   - Traffic on this port does NOT go through Home Assistant's auth.
#     Anyone on your network can open it, and the API keys ride in the
#     redirected URL — so treat it as LAN-only.
#   - The per-user monochrome override only works over ingress (it needs
#     the X-Remote-User-Display-Name header that ingress adds). Over this
#     port everyone gets the addon-wide `monochrome` default.
# Remap the host port or remove it entirely from the add-on's Network tab
# if you don't want direct access.
ports:
  "8099/tcp": 8099
ports_description:
  "8099/tcp": "Direct web UI access (no HA auth — keep to your LAN)"

# Defaults shown in the add-on Configuration tab on first install.
options:
  latitude: null
  longitude: null
  zipcode: null
  geoapify_api_key: null
  openweathermap_appid: null
  awn_api_key: null
  awn_application_key: null
  weather_source: OpenMeteo
  monochrome: false
  # HA user display names (the same string shown under Settings → People)
  # that should always see the monochrome dashboard. Everyone else gets
  # the addon-wide `monochrome:` value above — which defaults to color.
  monochrome_users: []

# Validation schema. `?` suffix makes a field optional. `password` masks the
# value in the HA UI but is passed to the addon in plain text — same trust
# level as the Vercel URL params.
schema:
  latitude: "float?"
  longitude: "float?"
  zipcode: "str?"
  geoapify_api_key: "password?"
  openweathermap_appid: "password?"
  awn_api_key: "password?"
  awn_application_key: "password?"
  weather_source: "list(OpenMeteo|OpenWeatherMap)"
  monochrome: "bool"
  monochrome_users:
    - "str"

# The Settings modal in the app uses URL params as the source of truth, so
# we don't need persistent storage. /data is mounted only because HA writes
# options.json there.
map: []
